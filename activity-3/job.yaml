resources:
  jobs:
    Databricks_Workflow:
      name: Databricks Workflow
      schedule:
        quartz_cron_expression: 0 0 23 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/myemail@gmail.com/RocketLab-activities/activity-3/Landing_to_Bronze
            source: WORKSPACE
          timeout_seconds: 600
        - task_key: to_Silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/myemail@gmail.com/RocketLab-activities/activity-3/Bronze_to_Silver
            source: WORKSPACE
          timeout_seconds: 1800
        - task_key: to_Gold
          depends_on:
            - task_key: to_Silver
          notebook_task:
            notebook_path: /Workspace/Users/myemail@gmail.com/RocketLab-activities/activity-3/Silver_to_Gold
            source: WORKSPACE
          timeout_seconds: 1800
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
